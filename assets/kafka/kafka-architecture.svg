<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#991b1b"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>

  <!-- Sample message -->
  <rect x="40" y="10" width="290" height="125" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <g font-family="Consolas, monospace" font-size="11" fill="#334155">
    <text x="52" y="29">{</text>
    <text x="64" y="45">"eventTime": 1572559200000,</text>
    <text x="64" y="60">"eventType": "view",</text>
    <text x="64" y="75">"productId": "1003461",</text>
    <text x="64" y="90">"categoryCode": "electronics.smartphone",</text>
    <text x="64" y="105">"brand": "xiaomi",</text>
    <text x="64" y="120">"price": 489.07</text>
    <text x="52" y="132">}</text>
  </g>
  <path d="M185 136 Q 150 175 125 210" fill="none" stroke="#991b1b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Producer -->
  <ellipse cx="110" cy="240" rx="62" ry="28" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="110" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Producer</text>

  <!-- External systems -->
  <rect x="30" y="335" width="170" height="115" rx="10" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="115" y="355" text-anchor="middle" font-size="12" fill="#111827">External Systems</text>
  <g fill="#fff" stroke="#111827">
    <rect x="48" y="368" width="70" height="22" rx="4"/>
    <rect x="62" y="388" width="70" height="22" rx="4"/>
    <rect x="76" y="408" width="70" height="22" rx="4"/>
  </g>
  <g font-size="11" fill="#111827" text-anchor="middle">
    <text x="83" y="383">CSV</text><text x="97" y="403">CSV</text><text x="111" y="423">CSV</text>
  </g>
  <line x1="110" y1="269" x2="110" y2="333" stroke="#991b1b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Kafka cluster -->
  <rect x="360" y="130" width="200" height="300" rx="20" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="460" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Kafka</text>
  <g fill="#fff" stroke="#111827" stroke-width="1.5">
    <rect x="380" y="180" width="160" height="38" rx="8"/>
    <rect x="380" y="228" width="160" height="38" rx="8"/>
    <rect x="380" y="276" width="160" height="38" rx="8"/>
    <rect x="380" y="372" width="160" height="38" rx="8"/>
  </g>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <text x="460" y="204">Broker 1</text>
    <text x="460" y="252">Broker 2</text>
    <text x="460" y="300">Broker 3</text>
    <text x="460" y="396">Broker N</text>
  </g>
  <line x1="460" y1="322" x2="460" y2="362" stroke="#111827" stroke-dasharray="3 4"/>

  <!-- Producer -> Kafka, Consumer -> Kafka -->
  <line x1="174" y1="240" x2="358" y2="240" stroke="#991b1b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="266" y="230" text-anchor="middle" font-size="12" fill="#374151">Sends Messages</text>
  <ellipse cx="742" cy="240" rx="62" ry="28" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="742" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Consumer</text>
  <line x1="678" y1="240" x2="562" y2="240" stroke="#991b1b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="620" y="230" text-anchor="middle" font-size="12" fill="#374151">Consumes Messages</text>

  <!-- Broker N -> Topic -->
  <line x1="542" y1="391" x2="638" y2="391" stroke="#991b1b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="640" y="373" width="90" height="36" rx="6" fill="#fff" stroke="#111827" stroke-width="1.5"/>
  <text x="685" y="396" text-anchor="middle" font-size="14" fill="#111827">Topic</text>

  <!-- Topic -> partitions -->
  <path d="M685 409 V450 M440 450 H760" fill="none" stroke="#991b1b" stroke-width="2"/>
  <line x1="440" y1="450" x2="440" y2="486" stroke="#991b1b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="450" x2="600" y2="486" stroke="#991b1b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="450" x2="760" y2="486" stroke="#991b1b" stroke-width="2" marker-end="url(#arr)"/>
  <g fill="#0ea5b7" stroke="#0e7490" stroke-width="1.5">
    <rect x="380" y="490" width="120" height="38" rx="8"/>
    <rect x="540" y="490" width="120" height="38" rx="8"/>
    <rect x="700" y="490" width="120" height="38" rx="8"/>
  </g>
  <g font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="440" y="514">Partition 0</text>
    <text x="600" y="514">Partition 1</text>
    <text x="760" y="514">Partition 2</text>
  </g>

  <!-- Partition 0 -> segments -->
  <g stroke="#991b1b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)">
    <line x1="440" y1="530" x2="300" y2="586"/>
    <line x1="440" y1="530" x2="440" y2="586"/>
    <line x1="440" y1="530" x2="580" y2="586"/>
  </g>
  <rect x="245" y="590" width="110" height="38" rx="6" fill="#111827"/>
  <rect x="385" y="590" width="110" height="38" rx="6" fill="#111827"/>
  <rect x="525" y="590" width="110" height="38" rx="6" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <g font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="300" y="614">Segment 1</text>
    <text x="440" y="614">Segment 2</text>
    <text x="580" y="614">Segment 3</text>
  </g>
  <text x="580" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Active Segment</text>
  <text x="655" y="605" font-size="11" fill="#374151">Actual files on the file</text>
  <text x="655" y="620" font-size="11" fill="#374151">system containing records</text>
</svg>
